<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>iPod Classic</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; }
  body {
    background:transparent; height:100vh; display:flex;
    align-items:center; justify-content:center;
    font:13px/1.35 "Helvetica Neue", -apple-system, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing:antialiased;
  }

  /* ---------- obudowa ---------- */
  .ipod {
    width:372px; height:640px; border-radius:28px; padding:26px 36px 0;
    background:linear-gradient(160deg,#fdfdfe 0%,#e9eaee 18%,#dcdde2 55%,#cbccd2 100%);
    /* ponytail: bez zewnetrznego drop-shadow - na macOS Tahoe w oknie
       transparent zapieka sie w statyczne paski. Zostaja tylko insety + hairline. */
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 -1px 0 rgba(0,0,0,.06) inset,
      0 0 0 1px rgba(0,0,0,.16);
    display:flex; flex-direction:column; align-items:center;
    -webkit-app-region:drag; position:relative;
  }
  .win { position:absolute; top:11px; right:13px; display:flex; gap:7px; -webkit-app-region:no-drag; }
  .win i { width:11px; height:11px; border-radius:50%; cursor:pointer; opacity:0; transition:opacity .15s; }
  .ipod:hover .win i { opacity:.7; }
  .win i:hover { opacity:1 !important; }
  .win .c { background:#ff5f57; } .win .m { background:#febc2e; }

  /* ---------- ekran ---------- */
  .bezel {
    width:300px; height:230px; border-radius:5px; padding:4px;
    background:linear-gradient(#2b2b2d,#111);
    box-shadow:0 1px 2px rgba(255,255,255,.7), 0 2px 7px rgba(0,0,0,.4) inset;
    -webkit-app-region:no-drag;
  }
  .lcd {
    width:100%; height:100%; border-radius:2px; overflow:hidden;
    background:#d8dee7; display:flex; flex-direction:column;
    color:#0d0d0d; position:relative;
  }

  .bar {
    height:21px; flex:none; display:flex; align-items:center; padding:0 6px;
    background:linear-gradient(#fcfcfd,#dfe3ea 48%,#ccd2dc 52%,#e6e9ef);
    border-bottom:1px solid #9aa0ab; font-size:11.5px; font-weight:600;
    text-shadow:0 1px 0 rgba(255,255,255,.8);
  }
  .bar .t { flex:1; text-align:center; letter-spacing:.1px; }
  .bar .pl { width:22px; font-size:10px; }
  .batt { width:22px; height:11px; border:1.2px solid #4b4b4b; border-radius:2px; position:relative; }
  .batt::after { content:''; position:absolute; right:-3.4px; top:3px; width:2px; height:5px; background:#4b4b4b; border-radius:0 1px 1px 0; }
  /* scaleX zamiast width - skaluje sie czysto wewnatrz ramki, bez wystawania */
  .batt i { position:absolute; inset:1.4px; border-radius:1px;
            background:linear-gradient(#7ee07e,#3faa3f);
            transform-origin:left center;
            transition:transform .6s ease, background .6s ease; }
  .batt.mid  i { background:linear-gradient(#ffd98a,#e8a317); }
  .batt.low  i { background:linear-gradient(#ff9b8f,#d9382a); }
  .bolt { font-size:9px; margin-left:2px; color:#3c7a3c; }

  .body { flex:1; display:flex; overflow:hidden; }
  .list { flex:1; overflow-y:auto; background:#fff; scrollbar-width:none; }
  .list::-webkit-scrollbar { display:none; }
  .split .list { flex:0 0 55%; border-right:1px solid #b9bec7; }

  .row {
    display:flex; align-items:center; gap:5px; padding:4px 6px;
    font-size:13px; border-bottom:1px solid #eef0f3;
  }
  /* dlugie tytuly lamia sie na druga linie zamiast uciekac w prawo */
  .row .lbl {
    flex:1; min-width:0; line-height:1.25;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; overflow-wrap:anywhere;
  }
  .row .ch { font-size:11px; color:#8b9099; }
  /* ---------- Cover Flow: okladki w harmonijke ---------- */
  .cf { flex:1; position:relative; overflow:hidden;
        background:linear-gradient(#20242c 0%,#0c0e12 62%,#000 100%);
        perspective:620px; perspective-origin:50% 42%; }
  .cf .cv {
    position:absolute; left:50%; top:42%; width:86px; height:86px;
    margin:-43px 0 0 -43px; transform-style:preserve-3d;
    transition:transform .3s cubic-bezier(.25,.8,.35,1), opacity .3s ease;
    background:linear-gradient(135deg,#5b6270,#2e333d);
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 6px 16px rgba(0,0,0,.65);
  }
  /* absolutnie, bo w kontenerze flex obrazek nie wypelnial kafelka */
  .cf .cv img { position:absolute; inset:0; width:100%; height:100%;
                object-fit:cover; display:block; }
  .cf .cv svg { width:50%; height:50%; opacity:.85; }
  /* odbicie pod okladka - to co sprzedaje efekt */
  .cf .cv::after {
    content:''; position:absolute; top:100%; left:0; right:0; height:100%;
    background:inherit; transform:scaleY(-1); transform-origin:top;
    opacity:.22; filter:blur(.4px);
    -webkit-mask-image:linear-gradient(rgba(0,0,0,.55),transparent 62%);
  }
  .cf .cap {
    position:absolute; left:0; right:0; bottom:9px; text-align:center;
    color:#fff; font-size:10.5px; font-weight:600; padding:0 8px;
    text-shadow:0 1px 3px rgba(0,0,0,.9); line-height:13px;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden; overflow-wrap:anywhere;
  }
  .cf .cap small { display:block; font-weight:400; font-size:10px;
                   color:rgba(255,255,255,.6); margin-top:1px; }
  .row.sel {
    background:linear-gradient(#6fb0e8,#2f7ec9 52%,#2a70bb 53%,#3f8ada);
    color:#fff; text-shadow:0 1px 1px rgba(0,0,0,.35);
    border-bottom-color:#2a70bb;
  }
  .row.sel .ch { color:#fff; }

  .prev { flex:1; background:linear-gradient(#f7f8fa,#dfe3ea); display:flex;
          flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:10px; }
  .art {
    width:104px; height:104px; border-radius:3px; flex:none;
    background:linear-gradient(135deg,#5b6270,#2e333d);
    box-shadow:0 2px 6px rgba(0,0,0,.3); position:relative; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    color:rgba(255,255,255,.85); font-size:34px;
  }
  .art img { width:100%; height:100%; object-fit:cover; display:block; }
  .art svg { width:52%; height:52%; opacity:.92; }
  .art .grid { display:grid; grid-template-columns:1fr 1fr; width:100%; height:100%; }
  .art .grid img { width:100%; height:100%; }
  .art::after { content:''; position:absolute; inset:0; pointer-events:none;
    background:linear-gradient(125deg,rgba(255,255,255,.34) 0%,transparent 46%); }
  .prev .cap { font-size:11px; color:#555b66; text-align:center; line-height:1.3;
               max-width:100%; overflow:hidden; overflow-wrap:anywhere;
               display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; }

  /* ---------- now playing ---------- */
  .np { flex:1; background:linear-gradient(#fbfcfd,#e4e8ee); display:flex;
        flex-direction:column; align-items:center; padding:9px 12px; gap:7px; }
  .np { gap:5px; }
  .np .art { width:70px; height:70px; }
  .np .ti { font-size:13.5px; font-weight:600; text-align:center; max-width:100%; flex:none;
            line-height:17px; display:-webkit-box; -webkit-line-clamp:2;
            -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .np .ar { font-size:12px; color:#4c525c; max-width:100%; flex:none; text-align:center;
            line-height:15px; display:-webkit-box; -webkit-line-clamp:2;
            -webkit-box-orient:vertical; overflow:hidden; overflow-wrap:anywhere; }
  .np .nof { font-size:10.5px; color:#767c86; flex:none; line-height:14px; }
  .prog { width:100%; margin-top:auto; }
  .track {
    height:9px; border-radius:5px; background:#c3c8d1;
    box-shadow:0 1px 2px rgba(0,0,0,.22) inset; overflow:hidden;
  }
  .track i { display:block; height:100%; width:0;
    background:linear-gradient(#8fc4f2,#3d84cf 52%,#2f74bf 53%,#5ba0e0); }
  .times { display:flex; justify-content:space-between; font-size:10px; color:#5b6069; margin-top:3px; }

  /* ---------- ekrany odtwarzania (Ustawienia > Ekran odtwarzania) ---------- */
  .np .stage { flex:1; width:100%; min-height:0; position:relative; overflow:hidden;
               display:flex; align-items:center; justify-content:center; }
  .np .foot { width:100%; flex:none; display:flex; flex-direction:column;
              align-items:center; gap:1px; }
  .np.classic .art { width:78px; height:78px; }

  /* motywy pelnoekranowe: opis i pasek leza NA obrazie */
  .np.ov { padding:0; gap:0; position:relative; background:#000; }
  .np.ov .stage { position:absolute; inset:0; }
  .np.ov .foot { position:absolute; left:0; right:0; bottom:0; z-index:2; color:#fff;
                 padding:16px 12px 7px; background:linear-gradient(transparent,rgba(0,0,0,.8) 58%); }
  .np.ov .ar, .np.ov .nof { color:rgba(255,255,255,.72); }
  .np.ov .ti { text-shadow:0 1px 3px rgba(0,0,0,.85); }
  .np.ov .track { background:rgba(255,255,255,.26); box-shadow:none; }
  .np.ov .times { color:rgba(255,255,255,.72); }
  .np canvas { position:absolute; inset:0; width:100%; height:100%; }
  .np canvas.lofi { image-rendering:pixelated; }   /* matryca ma byc widoczna */

  /* pelna okladka - rozmyte tlo z tej samej grafiki */
  .st-cover .bg { position:absolute; inset:-14px; background:#1a1d22 center/cover;
                  filter:blur(12px) brightness(.5); }
  .st-cover .art { width:112px; height:112px; margin-bottom:52px; z-index:1;
                   box-shadow:0 7px 20px rgba(0,0,0,.65); }

  /* cover flow na ekranie odtwarzania - te same kafle co w Muzyce */
  .st-flow .cf { position:absolute; inset:0; }
  .st-flow .cf .cv { top:34%; width:92px; height:92px; margin:-46px 0 0 -46px; }

  /* winyl - krazek lezy za opisem, nizej, w calosci widoczny */
  .st-vinyl { background:radial-gradient(120% 95% at 50% 28%,#3b424e 0%,#0b0d12 100%); }
  /* wyzsza specyficznosc niz `.np .stage`, inaczej krazek dalej stal na srodku */
  .np .stage.st-vinyl { align-items:flex-start; }
  .st-vinyl .disc {
    width:146px; height:146px; margin-top:8px; border-radius:50%; position:relative;
    background:repeating-radial-gradient(circle at 50% 50%,#101116 0 2px,#292c33 2px 4px);
    box-shadow:0 6px 18px rgba(0,0,0,.65), 0 0 0 1px rgba(255,255,255,.14) inset;
    display:flex; align-items:center; justify-content:center;
    animation:spin 3.6s linear infinite;
  }
  .st-vinyl .disc.pz { animation-play-state:paused; }
  .st-vinyl .art { width:56px; height:56px; border-radius:50%; }
  .st-vinyl .disc::after {
    content:''; position:absolute; width:8px; height:8px; border-radius:50%; z-index:2;
    background:#eceef1; box-shadow:0 0 0 1px rgba(0,0,0,.45);
  }
  .st-vinyl .disc::before {                       /* refleks swiatla na krazku */
    content:''; position:absolute; inset:0; border-radius:50%; z-index:1; pointer-events:none;
    background:linear-gradient(125deg,rgba(255,255,255,.24) 0%,transparent 42%,transparent 58%,rgba(255,255,255,.1) 100%);
  }
  @keyframes spin { to { transform:rotate(360deg); } }

  /* delfiny / wyscigowka / wskazowki - wyswietlacz jak w Pioneerze */
  .st-dolphins, .st-race, .st-gauges, .st-dj { background:linear-gradient(#0b2c47,#04121f 68%,#010810); }
  .st-gauges::after, .st-dj::after {          /* siatka pikseli - to daje klimat matrycy */
    content:''; position:absolute; inset:0; pointer-events:none; z-index:1;
    background:
      repeating-linear-gradient(rgba(0,0,0,.26) 0 1px, transparent 1px 2px),
      repeating-linear-gradient(90deg, rgba(0,0,0,.17) 0 1px, transparent 1px 2px);
  }
  .st-wave { background:radial-gradient(120% 90% at 50% 40%,#1d3350 0%,#070b12 100%); }

  /* ---------- ekran pobierania ---------- */
  .dl { flex:1; background:#fff; padding:12px; display:flex; flex-direction:column; gap:9px; }
  .dl h3 { font-size:12.5px; font-weight:600; }
  .dl input {
    font:12px "Helvetica Neue", sans-serif; padding:6px 7px; border:1px solid #a8aeb8;
    border-radius:3px; outline:none; background:#fdfdfd; user-select:text;
  }
  .dl input:focus { border-color:#3d84cf; box-shadow:0 0 0 2px rgba(61,132,207,.24); }
  .dl .seg { display:flex; border:1px solid #a8aeb8; border-radius:3px; overflow:hidden; flex:none; }
  .dl .seg button {
    flex:1; font:11.5px "Helvetica Neue", sans-serif; padding:5px 0;
    border:0; background:#fdfdfd; color:#5b6069; cursor:pointer;
  }
  .dl .seg button.on {
    background:linear-gradient(#6fb0e8,#2f7ec9 52%,#2a70bb 53%,#3f8ada);
    color:#fff; font-weight:600; text-shadow:0 1px 1px rgba(0,0,0,.35);
  }
  .dl .msg { font-size:11px; color:#5b6069; line-height:1.45; }
  .dl .msg.err { color:#b3261e; }
  .dl .msg.ok { color:#1c6b2e; }
  .dl .hint { font-size:10.5px; color:#8b9099; margin-top:auto; line-height:1.4; }
  .dl code { background:#eef0f3; padding:1px 4px; border-radius:2px; font-size:10px; user-select:text; }

  /* ---------- click wheel ---------- */
  .wheelwrap { flex:1; display:flex; align-items:center; justify-content:center; -webkit-app-region:no-drag; }
  .wheel {
    width:216px; height:216px; border-radius:50%; position:relative; cursor:pointer;
    background:linear-gradient(150deg,#fbfbfc,#e4e5e9 46%,#d5d6db);
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 -1px 3px rgba(0,0,0,.1) inset,
      0 0 0 1px rgba(0,0,0,.11),
      0 3px 9px rgba(0,0,0,.17);
    display:flex; align-items:center; justify-content:center;
  }
  .wheel span {
    position:absolute; font-size:10.5px; font-weight:700; color:#8a8f98;
    letter-spacing:.7px; pointer-events:none; text-shadow:0 1px 0 rgba(255,255,255,.85);
    transition:color .25s, text-shadow .25s;
  }
  /* najechanie kursorem zapala kolo: napisy na bialo, krawedzie dostaja poswiate */
  .wheel { transition:box-shadow .35s ease; }
  .wheel:hover {
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 0 12px rgba(255,255,255,.4) inset,       /* miekka poswiata od krawedzi */
      0 0 14px 3px rgba(255,255,255,.32),
      0 0 26px 6px rgba(214,238,255,.2),
      0 3px 9px rgba(0,0,0,.17);
  }
  .wheel:hover span {
    color:#fff;
    text-shadow:0 1px 2px rgba(0,0,0,.45), 0 0 5px rgba(255,255,255,.9), 0 0 10px rgba(200,230,255,.6);
  }
  .wheel:hover .center {
    box-shadow:
      0 1px 0 rgba(255,255,255,.95) inset,
      0 0 9px rgba(255,255,255,.38) inset,
      0 0 11px 2px rgba(255,255,255,.32),
      0 0 20px 5px rgba(214,238,255,.2),
      0 2px 5px rgba(0,0,0,.1) inset;
  }
  .wheel .u { top:15px; } .wheel .d { bottom:15px; font-size:13px; }
  .wheel .l { left:17px; font-size:13px; } .wheel .r { right:17px; font-size:13px; }
  .center {
    width:78px; height:78px; border-radius:50%; cursor:pointer;
    background:linear-gradient(160deg,#f2f3f5,#dcdde2 55%,#cfd0d6);
    box-shadow:
      0 1px 0 rgba(255,255,255,.9) inset,
      0 0 0 1px rgba(0,0,0,.1),
      0 2px 5px rgba(0,0,0,.18) inset;
    transition:transform .07s, box-shadow .3s ease;
  }
  .center:active { transform:scale(.97); }
</style>
</head>
<body>
<div class="ipod">
  <div class="win"><i class="m" id="min"></i><i class="c" id="close"></i></div>

  <div class="bezel"><div class="lcd">
    <div class="bar">
      <div class="pl" id="playicon"></div>
      <div class="t" id="title">iPod</div>
      <div class="batt" id="batt"><i id="battfill"></i></div><span class="bolt" id="bolt"></span>
    </div>
    <div class="body" id="body"></div>
  </div></div>

  <div class="wheelwrap">
    <div class="wheel" id="wheel">
      <span class="u">MENU</span><span class="l">⏮</span><span class="r">⏭</span><span class="d">▶❙❙</span>
      <div class="center" id="center"></div>
    </div>
  </div>
</div>

<audio id="audio"></audio>

<script>
const $ = s => document.querySelector(s);
const audio = $('#audio'), body = $('#body');

let tracks = [], queue = [], qi = -1, stack = [], dlBin = null, dlDir = '';
let T = {}, LANGS = [], LOCALE = 'en';                 // teksty z i18n.js przez preload
const fill = (txt, vars) => String(txt).replace(/\{(\w+)\}/g, (m, k) => k in vars ? vars[k] : m);

// ---------- ekrany ----------
const MAIN = () => ({
  title:'iPod', split:true, sel:0,
  items:[
    { lbl:T.music,       icon:'collage',  go:() => MUSIC() },
    { lbl:T.download,    icon:'download', go:() => DOWNLOAD() },
    { lbl:T.shuffle,     icon:'shuffle',  act:() => { if(!tracks.length) return; queue=[...tracks].sort(()=>Math.random()-.5); play(0); push(NOWPLAYING()); } },
    { lbl:T.settings,    icon:'gear',     go:() => SETTINGS() },
    { lbl:T.nowPlaying,  icon:'play',     act:() => { if(qi>=0) push(NOWPLAYING()); } },
  ],
});

// przelaczane w Ustawieniach; zapamietane miedzy uruchomieniami
let coverView = localStorage.getItem('view') === 'cover';
let npTheme   = localStorage.getItem('nptheme') || 'classic';

const MUSIC = () => {
  if (!tracks.length)
    return { title:T.music, split:true, sel:0,
             items:[{ lbl:T.noTracks, leaf:true, act:()=>{} }] };
  return coverView ? COVERS() : {
    title:T.music, split:true, sel:0,
    items: tracks.map((t,i) => ({ lbl:t.title, sub:t.artist, art:t.art, leaf:true,
      act:() => { queue=[...tracks]; play(i); push(NOWPLAYING()); } })),
  };
};

const SETTINGS = () => ({
  title:T.settings, split:true, sel:0,
  items:[
    { lbl:`${T.view}: ${coverView ? T.viewCover : T.viewList}`, icon:'collage', leaf:true,
      act:() => { coverView = !coverView; localStorage.setItem('view', coverView ? 'cover' : 'list');
                  stack[stack.length-1] = SETTINGS(); render(); } },
    { lbl:`${T.npScreen}: ${T[(NP_THEMES.find(t => t[0] === npTheme) || NP_THEMES[0])[1]]}`, icon:'play',
      go:() => NPSCREEN() },
    { lbl:T.removeTrack,          icon:'trash',   go:() => REMOVE() },
    { lbl:`${T.language}: ${(LANGS.find(l => l[0] === LOCALE) || ['','English'])[1]}`, icon:'globe',
      go:() => LANGSCREEN() },
    { lbl:T.openFolder,           icon:'folder',  leaf:true, act:() => ipod.revealMusic() },
    { lbl:T.refresh,              icon:'refresh', leaf:true, act:async () => { await load(); render(); } },
    { lbl:T.about,                icon:'info',    go:() => ({ title:T.about, sel:0, items:[
        { lbl:`${T.tracksCount}: ${tracks.length}`, leaf:true, act:()=>{} },
        { lbl:`${T.downloader}: ${dlBin ? T.ready : T.unavailable}`, leaf:true, act:()=>{} },
        { lbl:'iPod Player — Electron', leaf:true, act:()=>{} },
      ]}) },
  ],
});

// Cover Flow - okladki ustawione w harmonijke, srodkowa na wprost.
// Jezyk: lista nazw wlasnych, wybor leci do main i tam sie zapisuje.
const LANGSCREEN = () => ({
  title:T.language, split:true,
  sel: Math.max(0, LANGS.findIndex(l => l[0] === LOCALE)),
  items: LANGS.map(([code, label]) => ({
    lbl:(LOCALE === code ? '✓ ' : '') + label, icon:'globe', leaf:true,
    act: async () => {
      const r = await ipod.setLanguage(code);
      LOCALE = r.locale; T = r.dict;
      stack[stack.length-1] = LANGSCREEN();
      render();
    },
  })),
});

const COVERS = () => ({
  title:T.music, sel:0, cf:true,
  items: tracks.map((t, i) => ({
    lbl:t.title, sub:t.artist, art:t.art,
    act:() => { queue = [...tracks]; play(i); push(NOWPLAYING()); },
  })),
});

// Usuwanie z poziomu aplikacji - dwa kroki, zeby nie skasowac czegos jednym kliknieciem.
const REMOVE = () => ({
  title:T.removeTrack, split:true, sel:0,
  items: tracks.length
    ? tracks.map(t => ({ lbl:t.title, sub:t.artist, art:t.art, go:() => CONFIRM(t) }))
    : [{ lbl:T.noTracks, icon:'trash', leaf:true, act:()=>{} }],
});

const CONFIRM = (t) => {
  const s = {
    title:T.sure, split:true, sel:1,             // kursor domyslnie na "Nie"
    items:[
      { lbl:T.yesRemove, icon:'trash', sub:t.title, leaf:true, act: async () => {
          const r = await ipod.deleteTrack(t.file);
          if (!r.ok) { s.items[0].lbl = '✗ ' + r.error; return render(); }
          // jesli akurat gral - zatrzymaj, bo plik zniknal spod niego
          if (queue[qi] && queue[qi].file === t.file) {
            audio.pause(); audio.src = ''; qi = -1; queue = [];
          }
          await load();
          stack.pop();                            // wyjdz z potwierdzenia
          stack[stack.length - 1] = REMOVE();      // i odswiez liste
          render();
        } },
      { lbl:T.no, sub:t.title, leaf:true, act:() => pop() },
    ],
  };
  return s;
};

const NP_THEMES = [
  ['classic',  'thClassic'],  ['cover',    'thCover'],
  ['flow',     'thFlow'],     ['vinyl',    'thVinyl'],
  ['dolphins', 'thDolphins'], ['race',     'thRace'],
  ['gauges',   'thGauges'],   ['dj',       'thDj'],
  ['wave',     'thWave'],     ['shuffle',  'thShuffle'],
];

// 'shuffle' losuje jeden z konkretnych ekranow przy kazdej zmianie utworu
const npStyle = () => npTheme === 'shuffle' ? (shuffled || 'classic') : npTheme;
let shuffled = null;
const reshuffle = () => {
  const pool = NP_THEMES.slice(1, -1).map(t => t[0]).filter(t => t !== shuffled);
  shuffled = pool[Math.floor(Math.random() * pool.length)];
};

// po zmianie motywu odswieza tylko ten ekran, ktory akurat widac
function refresh() {
  const s = cur();
  if (s.np) return renderNP();
  if (s.title === T.npScreen)      stack[stack.length-1] = NPSCREEN();
  else if (s.title === T.settings) stack[stack.length-1] = SETTINGS();
  render();
}

const NPSCREEN = () => ({
  title:T.npScreen, split:true,
  sel: Math.max(0, NP_THEMES.findIndex(t => t[0] === npTheme)),
  items: NP_THEMES.map(([id, key]) => ({
    lbl:(npTheme === id ? '✓ ' : '') + T[key], icon:'play', leaf:true,
    act:() => { npTheme = id; localStorage.setItem('nptheme', id);
                if (id === 'shuffle') reshuffle();
                stack[stack.length-1] = NPSCREEN(); render(); },
  })),
});

const NOWPLAYING = () => ({ title:T.nowPlaying, np:true });
const DOWNLOAD   = () => ({ title:T.download, dl:true });

// ---------- nawigacja ----------
const cur = () => stack[stack.length-1];
const push = s => { stack.push(s); render(); };
const pop  = () => { if(stack.length>1){ stack.pop(); render(); } };

function scroll(d) {
  const s = cur();
  if (s.np) return setVolume(d);   // na "Teraz odtwarzane" kolo reguluje glosnosc, jak w oryginale
  if (!s.items) return;
  s.sel = Math.max(0, Math.min(s.items.length-1, s.sel + d));
  if (s.cf) return layoutCF(s);          // same przesuniecie, bez przebudowy
  render();
  body.querySelector('.row.sel')?.scrollIntoView({ block:'nearest' });
}

function select() {
  const s = cur();
  if (!s.items) return;
  const it = s.items[s.sel];
  if (it.go) push(it.go()); else it.act?.();
}

// ---------- odtwarzanie ----------
function play(i) {
  if (!queue.length) return;
  qi = (i + queue.length) % queue.length;
  if (npTheme === 'shuffle') reshuffle();
  audio.src = queue[qi].file;
  audio.play().catch(()=>{});
  // bez tego ⏭/⏮ zmienialy dzwiek, ale ekran pokazywal dalej stary utwor
  if (cur()?.np) renderNP();
}
const toggle = () => { if (qi < 0) return; audio.paused ? audio.play().catch(()=>{}) : audio.pause(); };
const next = () => play(qi + 1);
const prev = () => { if (audio.currentTime > 3) audio.currentTime = 0; else play(qi - 1); };

// koniec listy = stop, jak w oryginale (przycisk ⏭ nadal zawija)
audio.addEventListener('ended', () => { if (qi < queue.length - 1) next(); else render(); });
audio.addEventListener('timeupdate', () => { if (cur()?.np) paintBar(); });
audio.addEventListener('play',  () => { $('#playicon').textContent = '▶'; spin(); });
audio.addEventListener('pause', () => { $('#playicon').textContent = '❙❙'; spin(); });
const spin = () => body.querySelector('.disc')?.classList.toggle('pz', audio.paused);

const fmt = s => isFinite(s) ? Math.floor(s/60) + ':' + String(Math.floor(s%60)).padStart(2,'0') : '0:00';

// Ten sam pasek pokazuje postep albo glosnosc - po 1.5s wraca do postepu,
// tak jak robil to oryginal.
let volMode = false, volTimer = null;

function setVolume(d) {
  audio.volume = Math.min(1, Math.max(0, audio.volume + d * 0.05));
  volMode = true;
  clearTimeout(volTimer);
  volTimer = setTimeout(() => { volMode = false; paintBar(); }, 1500);
  paintBar();
}

function paintBar() {
  const f = $('#pfill'); if (!f) return;
  if (volMode) {
    f.style.width = audio.volume * 100 + '%';
    $('#pnow').textContent = T.volume;
    $('#pend').textContent = Math.round(audio.volume * 100) + '%';
  } else {
    f.style.width = (audio.duration ? audio.currentTime/audio.duration*100 : 0) + '%';
    $('#pnow').textContent = fmt(audio.currentTime);
    $('#pend').textContent = '-' + fmt((audio.duration||0) - audio.currentTime);
  }
}
